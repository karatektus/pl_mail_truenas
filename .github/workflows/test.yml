name: test

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        values: [basic-values.yaml, custom-values.yaml]
    steps:
      - uses: actions/checkout@v4
      - name: Render, deploy and wait for healthy
        shell: bash
        run: |
          set -o pipefail
          status=0
          TEST_FILE=${{ matrix.values }} scripts/test.sh 2>&1 | tee test.log || status=$?
          if [ "$status" -ne 0 ]; then
            # The telling lines and the end of the log as annotations: those
            # are readable without signing in, the log itself is not. Kept
            # short, because an annotation is cut off after a few kilobytes.
            annotate() {
              sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' | cut -c1-300 \
                | awk -v title="$1" 'BEGIN { printf "::error title=%s::", title } { printf "%s%%0A", $0 } END { print "" }'
            }
            grep -a -n -E 'Exit code|✅|❌|[Ff]ailed|Permission denied|^rm:|^cp:|No such file|Traceback|Error:|unhealthy|Containers started' test.log \
              | grep -a -v -E '^[0-9]+:[a-z-]+-1 +\|' | tail -n 25 | annotate "Telling lines" || true
            tail -n 20 test.log | annotate "End of the test log" || true
          fi
          exit "$status"
      # The tooling regenerates the vendored library, the hashes and the
      # metadata in app.yaml. A difference means what is committed is not what
      # the catalogue would publish.
      - name: Committed files match what the tooling generates
        shell: bash
        run: |
          if ! git diff --exit-code -- ix-dev > generated.diff; then
            sed -e 's/%/%25/g' generated.diff | cut -c1-300 | head -n 120 \
              | awk 'BEGIN { printf "::error title=Generated files differ::" } { printf "%s%%0A", $0 } END { print "" }'
            exit 1
          fi
