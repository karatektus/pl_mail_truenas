images:
  image:
    repository: ghcr.io/karatektus/pl_mail
    tag: "0.2.54@sha256:277d7265fa3477e8bb3b524b67346ea3540065b5a3f244ce54df7211a6cd9a9b"
  postgres_image:
    repository: postgres
    tag: "18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873"

consts:
  plmail_container_name: plmail
  secrets_container_name: secrets-init
  worker_container_name: worker
  # The image reaches these two by name: POSTGRES_HOST defaults to "database"
  # and the bundled Caddyfile proxies /.well-known/mercure to "mercure:80".
  # The hub runs inside the worker, which carries that name as a network alias.
  postgres_container_name: database
  mercure_alias: mercure
  internal_http_port: 80
  # Everything plMail writes lives under this one mount.
  data_path: /app/var/data
  # Same directory, as the database sees it.
  shared_path: /plmail
  db_user: app
  db_name: app
  # uid/gid of the postgres user in the alpine image.
  postgres_uid: 70
  postgres_gid: 70
